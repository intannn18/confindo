<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register — CONFindo</title>
  <link rel="icon" type="image/png" href="../assets/logo-icon.png">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              blue: '#0B5796',
              blueDark: '#084375',
              orange: '#E65C00',
              orangeDark: '#CC5200'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Universal Navbar Placeholder -->
  <div id="navbarContainer"></div>

  <!-- Main Content -->
  <main class="flex-grow pt-24 pb-20 flex items-center justify-center">
    <div class="max-w-md w-full mx-auto px-4 sm:px-6">
      
      <!-- Card Container -->
      <div class="bg-white rounded-3xl p-8 border border-slate-200/90 shadow-xl space-y-6">
        
        <!-- Logo Header -->
        <div class="text-center space-y-2">
          <img src="../assets/logo.png" alt="CONFindo" class="h-10 w-auto mx-auto object-contain">
          <p class="text-xs text-slate-500 font-medium">Platform Self-Learning Public Speaking Mandiri</p>
        </div>

        <!-- Redirect Notice Banner -->
        <div id="loginNoticeBanner" class="hidden p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 flex items-start gap-2.5">
          <span class="text-base shrink-0">🔒</span>
          <span id="loginNoticeText" class="leading-relaxed font-semibold">Silakan login untuk melanjutkan ke halaman yang dituju.</span>
        </div>

        <!-- 1-Click Demo Login Shortcut -->
        <div class="p-3 bg-blue-50/70 rounded-2xl border border-blue-100 space-y-2">
          <span class="text-[10px] font-extrabold uppercase text-brand-blue tracking-wider block text-center">
            ⚡ MASUK CEPAT DEMO:
          </span>
          <div class="grid grid-cols-2 gap-2">
            <button 
              type="button" 
              onclick="demoLogin('dimas@example.com', 'user123')"
              class="p-2.5 rounded-xl bg-white border border-slate-200 hover:border-blue-400 font-bold text-slate-800 text-left transition-all hover:shadow-xs group cursor-pointer"
            >
              <div class="flex items-center gap-1.5 mb-0.5">
                <span class="text-xs">🎓</span>
                <span class="text-xs font-bold text-slate-800 group-hover:text-brand-blue">Akun Siswa</span>
              </div>
              <span class="text-[10px] text-slate-400 block font-normal">Dimas Pratama</span>
            </button>

            <button 
              type="button" 
              onclick="demoLogin('admin@confindo.id', 'Admin#CONFindo2026!')"
              class="p-2.5 rounded-xl bg-white border border-slate-200 hover:border-amber-400 font-bold text-slate-800 text-left transition-all hover:shadow-xs group cursor-pointer"
            >
              <div class="flex items-center gap-1.5 mb-0.5">
                <span class="text-xs">🛡️</span>
                <span class="text-xs font-bold text-slate-800 group-hover:text-amber-600">Akun Admin</span>
              </div>
              <span class="text-[10px] text-slate-400 block font-normal">Admin CONFindo</span>
            </button>
          </div>
        </div>

        <!-- Tab Toggle (Login vs Register) -->
        <div class="flex rounded-2xl bg-slate-100 p-1 text-xs font-bold">
          <button id="toggleLoginBtn" type="button" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-xl bg-white text-slate-900 shadow-2xs">
            Login
          </button>
          <button id="toggleRegisterBtn" type="button" onclick="switchAuthTab('register')" class="flex-1 py-2 rounded-xl text-slate-500 hover:text-slate-800">
            Register
          </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Email</label>
            <input 
              type="email" 
              id="loginEmail" 
              required 
              placeholder="nama@email.com" 
              class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
            >
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="font-bold text-slate-700">Password</label>
              <a href="javascript:void(0)" onclick="alert('Untuk prototype, Anda dapat menggunakan akun demo di atas atau mendaftar akun baru.')" class="text-[11px] text-brand-blue hover:underline">
                Lupa Password?
              </a>
            </div>
            <input 
              type="password" 
              id="loginPassword" 
              required 
              placeholder="••••••••" 
              class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
            >
          </div>

          <button 
            type="submit" 
            class="w-full py-3.5 rounded-xl bg-[#0B5796] hover:bg-[#084375] text-white font-bold text-xs shadow-md transition-all"
          >
            Masuk ke Akun
          </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="hidden space-y-3.5 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Full Name</label>
            <input 
              type="text" 
              id="regName" 
              required 
              placeholder="Nama Lengkap Anda" 
              class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
            >
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">Email</label>
            <input 
              type="email" 
              id="regEmail" 
              required 
              placeholder="nama@email.com" 
              class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
            >
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">Password</label>
            <input 
              type="password" 
              id="regPassword" 
              required 
              placeholder="Minimal 6 karakter" 
              class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
            >
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">Confirm Password</label>
            <input 
              type="password" 
              id="regConfirmPassword" 
              required 
              placeholder="Ulangi password" 
              class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
            >
          </div>

          <button 
            type="submit" 
            class="w-full py-3.5 rounded-xl bg-[#E65C00] hover:bg-[#CC5200] text-white font-bold text-xs shadow-md transition-all"
          >
            Daftar Akun Baru
          </button>
        </form>

        <p class="text-[11px] text-slate-400 text-center">
          Dengan masuk, Anda menyetujui ketentuan belajar mandiri di CONFindo.
        </p>

      </div>

    </div>
  </main>

  <!-- Universal Footer Placeholder -->
  <div id="footerContainer"></div>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/api.js?v=20261028_v8"></script>
  <script src="../js/navbar.js"></script>
  <script>
    function switchAuthTab(type) {
      if (type === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('toggleLoginBtn').className = 'flex-1 py-2 rounded-xl bg-white text-slate-900 shadow-2xs font-bold';
        document.getElementById('toggleRegisterBtn').className = 'flex-1 py-2 rounded-xl text-slate-500 hover:text-slate-800';
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('toggleRegisterBtn').className = 'flex-1 py-2 rounded-xl bg-white text-slate-900 shadow-2xs font-bold';
        document.getElementById('toggleLoginBtn').className = 'flex-1 py-2 rounded-xl text-slate-500 hover:text-slate-800';
      }
    }

    function redirectPostAuth(user) {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      const prodId = params.get('id');

      if (redirect === 'learn') {
        window.location.href = '../learn/index.html';
      } else if (redirect === 'store') {
        window.location.href = '../store/index.html';
      } else if (redirect === 'checkout') {
        window.location.href = prodId ? `../checkout/index.html?id=${prodId}` : '../checkout/index.html';
      } else if (redirect === 'product') {
        window.location.href = `../store/product.html?id=${prodId || 'prod-buku-ajar-public-speaking'}`;
      } else if (user.role === 'admin') {
        window.location.href = '../admin/index.html';
      } else {
        window.location.href = '../dashboard/index.html';
      }
    }

    async function demoLogin(email, pass) {
      const emailInput = document.getElementById('loginEmail');
      const passInput = document.getElementById('loginPassword');
      if (emailInput) emailInput.value = email;
      if (passInput) passInput.value = pass;

      const res = await window.confApi.login(email, pass);
      if (res.success) {
        redirectPostAuth(res.user);
      } else {
        alert(res.message);
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn ? submitBtn.innerText : 'Login';

      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = 'Memeriksa...';
      }

      const res = await window.confApi.login(email, pass);
      if (res.success) {
        redirectPostAuth(res.user);
      } else {
        alert(res.message);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = originalText;
        }
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn ? submitBtn.innerText : 'Daftar Akun';

      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPassword').value;
      const confirmPass = document.getElementById('regConfirmPassword').value;

      if (pass !== confirmPass) {
        alert('Password dan Confirm Password tidak cocok!');
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = 'Menyimpan Akun...';
      }

      const res = await window.confApi.register(name, email, pass);
      if (res.success) {
        alert('Akun berhasil didaftarkan!');
        redirectPostAuth(res.user);
      } else {
        alert(res.message);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = originalText;
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      
      // Auto-switch to register tab if requested
      if (params.get('tab') === 'register') {
        switchAuthTab('register');
      }

      // Show friendly redirect banner
      const redirect = params.get('redirect');
      const banner = document.getElementById('loginNoticeBanner');
      const text = document.getElementById('loginNoticeText');

      if (redirect && banner && text) {
        banner.classList.remove('hidden');
        if (redirect === 'learn') {
          text.innerHTML = 'Silakan <strong>login atau daftar akun</strong> untuk mengakses seluruh materi video tutorial di halaman <strong>Learn</strong>.';
        } else if (redirect === 'store') {
          text.innerHTML = 'Silakan <strong>login atau daftar akun</strong> untuk mengakses katalog produk digital e-book & template slide di halaman <strong>Store</strong>.';
        } else if (redirect === 'checkout') {
          text.innerHTML = 'Silakan <strong>login atau daftar akun</strong> terlebih dahulu untuk melanjutkan proses pemesanan lisensi berkas digital.';
        } else {
          text.innerHTML = 'Silakan masuk ke akun CONFindo Anda terlebih dahulu.';
        }
      }
    });
  </script>
</body>
</html>
